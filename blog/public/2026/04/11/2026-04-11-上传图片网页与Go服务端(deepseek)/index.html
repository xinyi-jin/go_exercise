r>    &#125;<br>&#125;<br><br>// serveUploadPage 返回图片上传界面HTML<br>func serveUploadPage(c *gin.Context) &#123;<br>    // 注意: 在实际项目中可以将html单独存为文件然后使用 c.File()<br>    // 此处为了演示直接写HTML字符串（从上面前端代码嵌入）<br>    // 由于上面HTML代码较长，采用多行字符串返回<br>    htmlContent := getUploadHTML()<br>    c.Header(&quot;Content-Type&quot;, &quot;text/html; charset=utf-8&quot;)<br>    c.String(http.StatusOK, htmlContent)<br>&#125;<br><br>// handleImageUpload 处理图片上传<br>func handleImageUpload(c *gin.Context) &#123;<br>    // 限制请求体大小<br>    c.Request.Body = http.MaxBytesReader(c.Writer, c.Request.Body, maxUploadSize)<br>    // 从表单获取文件，字段名为 &#x27;image&#x27; (和前端FormData保持一致)<br>    file, header, err := c.Request.FormFile(&quot;image&quot;)<br>    if err != nil &#123;<br>        c.JSON(http.StatusBadRequest, UploadResponse&#123;<br>            Code:    400,<br>            Message: &quot;获取上传文件失败: &quot; + err.Error(),<br>        &#125;)<br>        return<br>    &#125;<br>    defer file.Close()<br><br>    // 校验文件大小 (gin默认也有，但再确认)<br>    if header.Size &gt; maxUploadSize &#123;<br>        c.JSON(http.StatusBadRequest, UploadResponse&#123;<br>            Code:    400,<br>            Message: fmt.Sprintf(&quot;文件超过最大限制 %dMB&quot;, maxUploadSize&gt;&gt;20),<br>        &#125;)<br>        return<br>    &#125;<br><br>    // 获取文件名并校验扩展名<br>    filename := header.Filename<br>    ext := strings.ToLower(filepath.Ext(filename))<br>    if !isAllowedExtension(ext) &#123;<br>        c.JSON(http.StatusBadRequest, UploadResponse&#123;<br>            Code:    400,<br>            Message: &quot;不支持的文件类型，请上传 JPG/PNG/GIF/WEBP 格式图片&quot;,<br>        &#125;)<br>        return<br>    &#125;<br><br>    // 生成安全文件名: 时间戳+随机数+原扩展名，避免重名和路径攻击<br>    safeFilename := generateSafeFilename(ext)<br>    savePath := filepath.Join(uploadDir, safeFilename)<br><br>    // 保存文件<br>    if err := c.SaveUploadedFile(header, savePath); err != nil &#123;<br>        log.Printf(&quot;保存文件失败: %v&quot;, err)<br>        c.JSON(http.StatusInternalServerError, UploadResponse&#123;<br>            Code:    500,<br>            Message: &quot;保存图片失败，请稍后重试&quot;,<br>        &#125;)<br>        return<br>    &#125;<br><br>    // 构建可访问的URL<br>    // 例如: /uploads/20241215_163022_abcd1234.png<br>    fileURL := fmt.Sprintf(&quot;%s/%s&quot;, staticRoutePath, safeFilename)<br><br>    // 返回成功信息<br>    c.JSON(http.StatusOK, UploadResponse&#123;<br>        Code:    200,<br>        Message: &quot;上传成功&quot;,<br>        Data: &amp;FileInfo&#123;<br>            Filename: safeFilename,<br>            URL:      fileURL,<br>            Size:     header.Size,<br>        &#125;,<br>    &#125;)<br>    log.Printf(&quot;上传成功: %s -&gt; %s (大小: %d bytes)&quot;, filename, savePath, header.Size)<br>&#125;<br><br>// 检查扩展名是否在白名单内<br>func isAllowedExtension(ext string) bool &#123;<br>    ext = strings.ToLower(ext)<br>    allowedList := []string&#123;&quot;.jpg&quot;, &quot;.jpeg&quot;, &quot;.png&quot;, &quot;.gif&quot;, &quot;.webp&quot;&#125;<br>    for _, allowed := range allowedList &#123;<br>        if ext == allowed &#123;<br>            return true<br>        &#125;<br>    &#125;<br>    return false<br>&#125;<br><br>// 生成唯一文件名: 时间戳_纳秒+随机后缀 (简单避免冲突)<br>func generateSafeFilename(ext string) string &#123;<br>    // 使用纳秒时间戳 + 随机字符串，保证唯一性且安全<br>    timestamp := time.Now().UnixNano() // 纳秒级别<br>    // 附加随机字符串提高安全性 (也可以用uuid，简单方式)<br>    randomPart := fmt.Sprintf(&quot;%d&quot;, time.Now().UnixNano()%1000000)<br>    // 文件名类似: 1702645123456789_123456.png<br>    return fmt.Sprintf(&quot;%d_%s%s&quot;, timestamp, randomPart, ext)<br>&#125;<br><br>// 确保上传目录存在<br>func ensureUploadDir(dir string) error &#123;<br>    if _, err := os.Stat(dir); os.IsNotExist(err) &#123;<br>        return os.MkdirAll(dir, 0755)<br>    &#125;<br>    return nil<br>&#125;<br><br>// 获取绝对路径，辅助日志<br>func getAbsPath(dir string) string &#123;<br>    abs, err := filepath.Abs(dir)<br>    if err != nil &#123;<br>        return dir<br>    &#125;<br>    return abs<br>&#125;<br><br>// getUplo loadBtn.disabled = false;</span></span><br><span class="hljs-string"><span class="language-javascript">                uploadBtn.textContent = &#x27;📤 上传到服务器&#x27;;</span></span><br><span class="hljs-string"><span class="language-javascript">            &#125;</span></span><br><span class="hljs-string"><span class="language-javascript">        &#125;);</span></span><br><span class="hljs-string"><span class="language-javascript">        setStatus(&#x27;info&#x27;, &#x27;✨ 就绪，点击上方区域选择图片或拖拽图片至此&#x27;);</span></span><br><span class="hljs-string"><span class="language-javascript">    &#125;)();</span></span><br><span class="hljs-string"><span class="language-javascript"></span></span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span><br><span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span><br><span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>`<br>&#125;<br>图片上传服务部署与使用<br>您可以通过以下步骤快速启动并体验这个图片上传工具。<br><br>服务端运行：将提供的Go代码保存为 main.go，在终端执行 go run main.go。服务默认会在 http://localhost:8080 启动，并自动创建 ./uploads 文件夹用于存储图片。<br><br>前端交互：启动服务后，用浏览器访问 http://localhost:8080 即可看到上传界面。您可以通过点击或拖拽的方式选择图片（支持JPG、PNG、GIF、WEBP格式，最大10MB），图片会实时预览。<br><br>上传流程：选择图片后点击“上传到服务器”，前端会将图片通过 FormData 发送到后端的 /api/upload 接口。后端会校验文件类型和大小，并为文件生成唯一名称保存到 uploads 目录。<br><br>结果反馈：上传成功后，页面会显示服务器返回的图片访问URL，您可以直接点击查看。所有上传的图片都会通过 /uploads/ 路由对外提供静态访问。<br><br>优化建议： 您可以根据需要调整 maxUploadSize（最大文件大小）和 allowedExts（允许的文件类型）常量。生产环境下，建议将前端HTML代码分离为独立文件，并通过 c.File() 提供，而不是嵌入在Go代码中。<br><br>对应实现一个查看预览已上传图片列表的接口<br>以下是增强后的服务端程序，新增了查看已上传图片列表的接口，并对前端界面进行了扩展以展示图片列表。<br><br>go<br>package main<br><br>import (<br>    &quot;fmt&quot;<br>    &quot;log&quot;<br>    &quot;net/http&quot;<br>    &quot;os&quot;<br>    &quot;path/filepath&quot;<br>    &quot;sort&quot;<br>    &quot;strings&quot;<br>    &quot;time&quot;<br><br>    &quot;github.com/gin-gonic/gin&quot;<br>)<br><br>// 上传配置常量<br>const (<br>    maxUploadSize   = 10 &lt;&lt; 20                 // 10MB<br>    uploadDir       = &quot;./uploads&quot;              // 存储目录<br>    allowedExts     = &quot;.jpg.jpeg.png.gif.webp&quot; // 允许扩展名<br>    staticRoutePath = &quot;/uploads&quot;               // 静态访问路由<br>)<br><br>// UploadResponse 定义上传返回结构<br>type UploadResponse struct &#123;<br>    Code    int       `json:&quot;code&quot;`<br>    Message string    `json:&quot;message&quot;`<br>    Data    *FileInfo `json:&quot;data,omitempty&quot;`<br>&#125;<br><br>// FileInfo 文件信息结构<br>type FileInfo struct &#123;<br>    Filename  string    `json:&quot;filename&quot;`<br>    URL       string    `json:&quot;url&quot;`<br>    Size      int64     `json:&quot;size&quot;`<br>    SizeKB    float64   `json:&quot;size_kb&quot;`<br>    SizeMB    float64   `json:&quot;size_mb&quot;`<br>    UploadTime time.Time `json:&quot;upload_time&quot;`<br>    Ext       string    `json:&quot;ext&quot;`<br>&#125;<br><br>// ImageListResponse 图片列表返回结构<br>type ImageListResponse struct &#123;<br>    Code    int        `json:&quot;code&quot;`<br>    Message string     `json:&quot;message&quot;`<br>    Data    *ImageListData `json:&quot;data,omitempty&quot;`<br>&#125;<br><br>// ImageListData 图片列表数据<br>type ImageListData struct &#123;<br>    Total   int         `json:&quot;total&quot;`<br>    Images  []*FileInfo `json:&quot;images&quot;`<br>    BaseURL string      `json:&quot;base_url&quot;`<br>&#125;<br><br>func main() &#123;<br>    // 设置 Gin 模式<br>    gin.SetMode(gin.ReleaseMode)<br>    r := gin.Default()<br><br>    // 添加CORS中间件（可选，方便跨域调试）<br>    r.Use(corsMiddleware())<br><br>    // 确保上传目录存在<br>    if err := ensureUploadDir(uploadDir); err != nil &#123;<br>        log.Fatalf(&quot;创建上传目录失败: %v&quot;, err)<br>    &#125;<br><br>    // 提供静态文件服务: 使上传的图片可以通过 /uploads/xxx 访问<br>    r.Static(staticRoutePath, uploadDir)<br><br>    // 处理前端页面<br>    r.GET(&quot;/&quot;, serveUploadPage)<br><br>    // 上传图片接口<br>    r.POST(&quot;/api/upload&quot;, handleImageUpload)<br><br>    // 获取图片列表接口<br>    r.GET(&quot;/api/images&quot;, handleGetImageList)<br><br>    // 删除图片接口（可选）<br>    r.DELETE(&quot;/api/images/:filename&quot;, handleDeleteImage)<br><br>    // 健康检查<br>    r.GET(&quot;/health&quot;, func(c *gin.Context) &#123;<br>        c.JSON(http.StatusOK, gin.H&#123;&quot;status&quot;: &quot;ok&quot;, &quot;time&quot;: time.Now().String()&#125;)<br>    &#125;)<br><br>    // 启动服务<br>    port := &quot;:8080&quot;<br>    log.Printf(&quot;🚀 Gin 图片上传服务启动在 http://localhost%s&quot;, port)<br>    log.Printf(&quot;📁 上传目录: %s (绝对路径: %s)&quot;, uploadDir, getAbsPath(uploadDir))<br>    log.Printf(&quot;📋 图片列表接口: http://localhost%s/api/images&quot;, port)<br>    if err := r.Run(port); err != nil &#123;<br>        log.Fatal(&quot;服务启动失败:&quot;, err)<br>    &#125;<br>&#125;<br><br>// corsMiddleware CORS中间件，允许前端跨域请求<br>func corsMiddleware() gin.HandlerFunc &#123;<br>    return func(c *gin.Context) &#123;<br>        c.Writer.Header().Set(&quot;Access-Control-Allow-Origin&quot;, &quot;*&quot;)<br>        c.Writer.Header().Set(&quot;Access-Control-Allow-Credentials&quot;, &quot;true&quot;)<br>        c.Writer.Header().Set(&quot;Access-Control-Allow-Headers&quot;, &quot;Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With&quot;)<br>        c.Writer.Header().Set(&quot;Access-Control-Allow-Methods&quot;, &quot;POST, OPTIONS, GET, PUT, DELETE&quot;)<br><br>        if c.Request.Method == &quot;OPTIONS&quot; &#123;<br>            c.AbortWithStatus(204)<br>            return<br>        &#125;<br><br>        c.Next()<br>    &#125;<br>&#125;<br><br>// serveUploadPage 返回图片上传界面HTML<br>func serveUploadPage(c *gin.Context) &#123;<br>    htmlContent := getUploadHTML()<br>    c.Header(&quot;Content-Type&quot;, &quot;text/html; charset=utf-8&quot;)<br>    c.String(http.StatusOK, htmlContent)<br>&#125;<br><br>// handleImageUpload 处理图片上传<br>func handleImageUpload(c *gin.Context) &#123;<br>    // 限制请求体大小<br>    c.Request.Body = http.MaxBytesReader(c.Writer, c.Request.Body, maxUploadSize)<br>    // 从表单获取文件，字段名为 &#x27;image&#x27;<br>    file, header, err := c.Request.FormFile(&quot;image&quot;)<br>    if err != nil &#123;<br>        c.JSON(http.StatusBadRequest, UploadResponse&#123;<br>            Code:    400,<br>            Message: &quot;获取上传文件失败: &quot; + err.Error(),<br>        &#125;)<br>        return<br>    &#125;<br>    defer file.Close()<br><br>    // 校验文件大小<br>    if header.Size &gt; maxUploadSize &#123;<br>        c.JSON(http.StatusBadRequest, UploadResponse&#123;<br>            Code:    400,<br>            Message: fmt.Sprintf(&quot;文件超过最大限制 %dMB&quot;, maxUploadSize&gt;&gt;20),<br>        &#125;)<br>        return<br>    &#125;<br><br>    // 获取文件名并校验扩展名<br>    filename := header.Filename<br>    ext := strings.ToLower(filepath.Ext(filename))<br>    if !isAllowedExtension(ext) &#123;<br>        c.JSON(http.StatusBadRequest, UploadResponse&#123;<br>            Code:    400,<br>            Message: &quot;不支持的文件类型，请上传 JPG/PNG/GIF/WEBP 格式图片&quot;,<br>        &#125;)<br>        return<br>    &#125;<br><br>    // 生成安全文件名<br>    safeFilename := generateSafeFilename(ext)<br>    savePath := filepath.Join(uploadDir, safeFilename)<br><br>    // 保存文件<br>    if err := c.SaveUploadedFile(header, savePath); err != nil &#123;<br>        log.Printf(&quot;保存文件失败: %v&quot;, err)<br>        c.JSON(http.StatusInternalServerError, UploadResponse&#123;<br>            Code:    500,<br>            Message: &quot;保存图片失败，请稍后重试&quot;,<br>        &#125;)<br>        return<br>    &#125;<br><br>    // 构建可访问的URL<br>    fileURL := fmt.Sprintf(&quot;%s/%s&quot;, staticRoutePath, safeFilename)<br><br>    // 返回成功信息<br>    c.JSON(http.StatusOK, UploadResponse&#123;<br>        Code:    200,<br>        Message: &quot;上传成功&quot;,<br>        Data: &amp;FileInfo&#123;<br>            Filename:   safeFilename,<br>            URL:        fileURL,<br>            Size:       header.Size,<br>            SizeKB:     float64(header.Size) / 1024,<br>            SizeMB:     float64(header.Size) / (1024 * 1024),<br>            UploadTime: time.Now(),<br>            Ext:        ext,<br>        &#125;,<br>    &#125;)<br>    log.Printf(&quot;上传成功: %s -&gt; %s (大小: %d bytes)&quot;, filename, savePath, header.Size)<br>&#125;<br><br>// handleGetImageList 获取已上传图片列表<br>func handleGetImageList(c *gin.Context) &#123;<br>    // 读取上传目录<br>    files, err := os.ReadDir(uploadDir)<br>    if err != nil &#123;<br>        c.JSON(http.StatusInternalServerError, ImageListResponse&#123;<br>            Code:    500,<br>            Message: &quot;读取图片列表失败: &quot; + err.Error(),<br>        &#125;)<br>        return<br>    &#125;<br><br>    var imageInfos []*FileInfo<br>    for _, file := range files &#123;<br>        if file.IsDir() &#123;<br>            continue<br>        &#125;<br>        <br>        filename := file.Name()<br>        ext := strings.ToLower(filepath.Ext(filename))<br>        <br>        // 只显示图片文件<br>        if !isAllowedExtension(ext) &#123;<br>            continue<br>        &#125;<br>        <br>        // 获取文件详细信息<br>        filePath := filepath.Join(uploadDir, filename)<br>        fileInfo, err := os.Stat(filePath)<br>        if err != nil &#123;<br>            log.Printf(&quot;获取文件信息失败 %s: %v&quot;, filename, err)<br>            continue<br>        &#125;<br>        <br>        // 获取文件修改时间作为上传时间<br>        uploadTime := fileInfo.ModTime()<br>        <br>        // 构建文件信息<br>        imageInfo := &amp;FileInfo&#123;<br>            Filename:   filename,<br>            URL:        fmt.Sprintf(&quot;%s/%s&quot;, staticRoutePath, filename),<br>            Size:       fileInfo.Size(),<br>            SizeKB:     float64(fileInfo.Size()) / 1024,<br>            SizeMB:     float64(fileInfo.Size()) / (1024 * 1024),<br>            UploadTime: uploadTime,<br>            Ext:        ext,<br>        &#125;<br>        imageInfos = append(imageInfos, imageInfo)<br>    &#125;<br>    <br>    // 按上传时间倒序排序（最新的在前面）<br>    sort.Slice(imageInfos, func(i, j int) bool &#123;<br>        return imageInfos[i].UploadTime.After(imageInfos[j].UploadTime)<br>    &#125;)<br>    <br>    c.JSON(http.StatusOK, ImageListResponse&#123;<br>        Code:    200,<br>        Message: &quot;获取成功&quot;,<br>        Data: &amp;ImageListData&#123;<br>            Total:   len(imageInfos),<br>            Images:  imageInfos,<br>            BaseURL: staticRoutePath,<br>        &#125;,<br>    &#125;)<br>&#125;<br><br>// handleDeleteImage 删除图片<br>func handleDeleteImage(c *gin.Context) &#123;<br>    filename := c.Param(&quot;filename&quot;)<br>    <br>    // 安全检查，防止路径遍历攻击<br>    if strings.Contains(filename, &quot;..&quot;) || strings.Contains(filename, &quot;/&quot;) || strings.Contains(filename, &quot;\\&quot;) &#123;<br>        c.JSON(http.StatusBadRequest, gin.H&#123;<br>            &quot;code&quot;:    400,<br>            &quot;message&quot;: &quot;非法文件名&quot;,<br>        &#125;)<br>        return<br>    &#125;<br>    <br>    // 检查文件扩展名<br>    ext := strings.ToLower(filepath.Ext(filename))<br>    if !isAllowedExtension(ext) &#123;<br>        c.JSON(http.StatusBadRequest, gin.H&#123;<br>            &quot;code&quot;:    400,<br>            &quot;message&quot;: &quot;只能删除图片文件&quot;,<br>        &#125;)<br>        return<br>    &#125;<br>    <br>    filePath := filepath.Join(uploadDir, filename)<br>    <br>    // 检查文件是否存在<br>    if _, err := os.Stat(filePath); os.IsNotExist(err) &#123;<br>        c.JSON(http.StatusNotFound, gin.H&#123;<br>            &quot;code&quot;:    404,<br>            &quot;message&quot;: &quot;文件不存在&quot;,<br>        &#125;)<br>        return<br>    &#125;<br>    <br>    // 删除文件<br>    if err := os.Remove(filePath); err != nil &#123;<br>        c.JSON(http.StatusInternalServerError, gin.H&#123;<br>            &quot;code&quot;:    500,<br>            &quot;message&quot;: &quot;删除文件失败: &quot; + err.Error(),<br>        &#125;)<br>        return<br>    &#125;<br>    <br>    log.Printf(&quot;删除成功: %s&quot;, filename)<br>    c.JSON(http.StatusOK, gin.H&#123;<br>        &quot;code&quot;:    200,<br>        &quot;message&quot;: &quot;删除成功&quot;,<br>    &#125;)<br>&#125;<br><br>// 检查扩展名是否在白名单内<br>func isAllowedExtension(ext string) bool &#123;<br>    ext = strings.ToLower(ext)<br>    allowedList := []string&#123;&quot;.jpg&quot;, &quot;.jpeg&quot;, &quot;.png&quot;, &quot;.gif&quot;, &quot;.webp&quot;&#125;<br>    for _, allowed := range allowedList &#123;<br>        if ext == allowed &#123;<br>            return true<br>        &#125;<br>    &#125;<br>    return false<br>&#125;<br><br>// 生成唯一文件名<br>func generateSafeFilename(ext string) string &#123;<br>    timestamp := time.Now().UnixNano()<br>    randomPart := fmt.Sprintf(&quot;%d&quot;, time.Now().UnixNano()%1000000)<br>    return fmt.Sprintf(&quot;%d_%s%s&quot;, timestamp, randomPart, ext)<br>&#125;<br><br>// 确保上传目录存在<br>func ensureUploadDir(dir string) error &#123;<br>    if _, err := os.Stat(dir); os.IsNotExist(err) &#123;<br>        return os.MkdirAll(dir, 0755)<br>    &#125;<br>    return nil<br>&#125;<br><br>// 获取绝对路径<br>func getAbsPath(dir string) string &#123;<br>    abs, err := filepath.Abs(dir)<br>    if err != nil &#123;<br>        return dir<br>    &#125;<br>    return abs<br>&#125;<br><br>// getUploadHTML 返回前端html界面（包含图片列表功能）<br>func getUploadHTML() string &#123;<br>    return `<span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span><br><span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;zh-CN&quot;</span>&gt;</span><br><span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span><br>    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span><br>    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;viewport&quot;</sp 计（图表）<br>- 文件类型分布统计<br>- 用户行为分析<br>- 系统资源监控（CPU/内存/磁盘）<br>- 操作审计日志<br>7. 界面与体验<br>go<br>- 深色/浅色主题切换<br>- 网格/列表视图切换<br>- 拖拽排序<br>- 快捷键支持<br>- 文件拖拽到文件夹<br>- 右键菜单（复制、移动、删除）<br>- 响应式设计优化<br>📝 重点功能实现示例<br>1. 批量上传 + 断点续传<br>go<br>// 分片上传结构<br>type ChunkUpload struct &#123;<br>    FileName   string `json:&quot;file_name&quot;`<br>    ChunkIndex int    `json:&quot;chunk_index&quot;`<br>    TotalChunks int   `json:&quot;total_chunks&quot;`<br>    UploadID   string `json:&quot;upload_id&quot;`<br>&#125;<br><br>// API端点<br>POST /api/upload/chunk    // 上传分片<br>POST /api/upload/merge     // 合并分片<br>GET  /api/upload/status    // 查询上传进度<br>2. 文件分享功能<br>go<br>type ShareInfo struct &#123;<br>    ID         string    `json:&quot;id&quot;`<br>    FileID     string    `json:&quot;file_id&quot;`<br>    Password   string    `json:&quot;password&quot;`<br>    ExpireAt   time.Time `json:&quot;expire_at&quot;`<br>    MaxDownloads int     `json:&quot;max_downloads&quot;`<br>    DownloadCount int    `json:&quot;download_count&quot;`<br>&#125;<br><br>// API端点<br>POST /api/share/:fileId      // 创建分享<br>GET  /api/share/:shareId     // 访问分享<br>DELETE /api/share/:shareId   // 取消分享<br>3. 文件版本控制<br>go<br>type FileVersion struct &#123;<br>    VersionID   string    `json:&quot;version_id&quot;`<br>    FileID      string    `json:&quot;file_id&quot;`<br>    Size        int64     `json:&quot;size&quot;`<br>    CreatedAt   time.Time `json:&quot;created_at&quot;`<br>    Comment     string    `json:&quot;comment&quot;`<br>&#125;<br><br>// API端点<br>GET    /api/files/:id/versions     // 获取版本列表<br>POST   /api/files/:id/versions     // 创建新版本<br>GET    /api/files/:id/versions/:vid // 恢复版本<br>DELETE /api/files/:id/versions/:vid // 删除版本<br>4. 文件搜索功能<br>go<br>// 全文搜索 + 过滤<br>GET /api/files/search?q=keyword&amp;type=image&amp;sort=date&amp;page=1&amp;size=20<br><br>// 支持搜索字段<br>- 文件名模糊搜索<br>- 文件内容搜索（文本文件）<br>- 按标签搜索<br>- 按上传时间范围<br>- 按文件大小范围<br>5. 回收站功能<br>go<br>type TrashItem struct &#123;<br>    ID         string    `json:&quot;id&quot;`<br>    FileID     string    `json:&quot;file_id&quot;`<br>    DeletedAt  time.Time `json:&quot;deleted_at&quot;`<br>    ExpireAt   time.Time `json:&quot;expire_at&quot;` // 30天后自动清理<br>&#125;<br><br>// API端点<br>GET    /api/trash              // 获取回收站列表<br>POST   /api/trash/restore/:id  // 恢复文件<br>DELETE /api/trash/permanent/:id // 永久删除<br>DELETE /api/trash/empty        // 清空回收站<br>🎨 前端功能增强<br>1. 文件管理器界面<br>html<br>- 左侧目录树<br>- 面包屑导航<br>- 文件多选（Ctrl/Shift）<br>- 拖拽移动文件<br>- 右键上下文菜单<br>- 键盘快捷键（删除、重命名、复制）<br>2. 实时通知<br>javascript<br>- WebSocket连接<br>- 上传完成通知<br>- 新文件通知<br>- 分享访问通知<br>3. 高级预览<br>javascript<br>- PDF.js集成（更好的PDF预览）<br>- 代码高亮（文本文件）<br>- Markdown渲染<br>- 3D模型预览（Three.js）<br>- 音视频播放器<br>📊 数据库设计建议<br>sql<br>-- 用户表<br>users (<br>    id, username, password, email, <br>    quota_total, quota_used, created_at<br>)<br><br>-- 文件表<br>files (<br>    id, user_id, parent_id, name, <br>    size, mime_type, hash, path,<br>    is_public, download_count, created_at<br>)<br><br>-- 分享表<br>shares (<br>    id, file_id, code, password,<br>    expire_at, max_downloads, created_at<br>)<br><br>-- 操作日志<br>logs (<br>    id, user_id, action, file_id,<br>    ip_address, created_at<br>)<br>🛠️ 技术栈建议<br>yaml<br>后端:<br>  - 数据库: PostgreSQL / MySQL<br>  - 缓存: Redis (会话、限流、队列)<br>  - 消息队列: RabbitMQ (异步处理)<br>  - 对象存储: MinIO / OSS / S3<br><br>前端:<br>  - 框架: Vue 3 / React<br>  - UI库: Element Plus / Ant Design<br>  - 状态管理: Pinia / Redux<br>  - 文件上传: resumable.js / spark-md5<br><br>部署:<br>  - 容器化: Docker + Docker Compose<br>  - 反向代理: Nginx<br>  - 进程管理: Supervisor / systemd<br>🎯 优先级建议<br>高优先级（用户体验）：<br><br>批量上传和拖拽上传<br><br>文件搜索功能<br><br>分享链接生成<br><br>缩略图预览<br><br>中优先级（功能完善）：<br><br>用户认证系统<br><br>文件夹管理<br><br>回收站功能<br><br>文件版本历史<br><br>低优先级（高级特性）：<br><br>在线编辑<br><br>断点续传<br><br>视频转码<br><br>WebDAV支持<br><br>这些功能可以根据您的实际需求选择性实现，建议先从高优先级功能开始逐步完善。需要我帮您实现其中某个具体功能吗？<br></code></pre></td></tr></table></figure>
